<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Demo HIS: todo el proceso de un paciente · Melissa Zamorano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#050b1a;--surf:rgba(14,32,60,.6);--ink:#e8f4ff;--mute:#93b4cc;--line:rgba(120,200,255,.22);--c:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(34,211,238,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.05) 1px,transparent 1px);background-size:44px 44px;color:var(--ink);font:400 16px/1.55 "Space Grotesk",system-ui,sans-serif;animation:grid 14s linear infinite}
@keyframes grid{to{background-position:0 44px,44px 0}}
h1,h2,h3,button,.pill{font-family:"Orbitron","Space Grotesk",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
.w{max-width:820px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:clamp(1.25rem,5.5vw,1.9rem);line-height:1.2;margin:8px 0 6px;background:linear-gradient(90deg,#34d399,#22d3ee,#a78bfa,#34d399);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-300% 0}}
.sub{color:var(--mute);margin:0 0 12px;font-size:.95rem}
.badge{display:inline-block;font:700 .7rem "Orbitron",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#06202e;background:#fbbf24;padding:4px 12px;border-radius:99px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.steps button{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surf);border-radius:99px;padding:5px 12px 5px 5px;font-size:.7rem;white-space:nowrap}
.steps b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--k);color:var(--k);font-size:.7rem}
.steps button.cur{border-color:var(--k);background:color-mix(in srgb,var(--k) 22%,transparent);box-shadow:0 0 16px -4px var(--k)}
.steps button.ok b{background:var(--k);color:#06202e}
.steps button:disabled{opacity:.35;cursor:not-allowed}
.role{padding:14px 16px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,transparent),transparent);margin-bottom:12px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.role small{font:700 .68rem "Orbitron",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.role h2{margin:2px 0 4px;font-size:1.1rem}
.role p{margin:0 0 6px;color:#d6ebff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent)}
.card{background:var(--surf);backdrop-filter:blur(8px);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;animation:in .35s ease}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:block;font-size:.78rem;color:var(--mute);margin-bottom:3px}
input[type=text],input[type=number],select{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}
select option{background:#0b1a33;color:#e8f4ff}
.ck{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:.95rem;color:var(--ink)}
.ck input{width:20px;height:20px;accent-color:var(--c)}
.btn{display:inline-block;margin-top:12px;border:0;background:var(--c);color:#06202e;font-weight:800;font-size:.82rem;padding:12px 22px;border-radius:99px;box-shadow:0 0 22px color-mix(in srgb,var(--c) 70%,transparent);transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.box{margin:12px 0 0;padding:12px 14px;border-radius:12px;font-size:.92rem}
.box.ok{background:rgba(52,211,153,.12);border:1.5px solid #34d399}
.box.bad{background:rgba(251,113,133,.14);border:1.5px solid #fb7185}
.box.warn{background:rgba(251,191,36,.12);border:1.5px solid #fbbf24}
.box b.t{display:block;font:700 .7rem "Orbitron",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.tb{width:100%;border-collapse:collapse;font-size:.92rem}
.tb td{padding:6px 0;border-bottom:1px solid var(--line)}.tb td:last-child{text-align:right}
.tb tr.t td{font-weight:700;border-bottom:0}
.rg{font-size:.75rem;color:var(--mute)}
.tabs{display:flex;gap:8px;margin:16px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:.75rem}
.tabs button.on{background:var(--ink);color:#050b1a;border-color:var(--ink)}
.hc{list-style:none;margin:0;padding:0}
.hc li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem;animation:in .3s ease}
.hc li span:first-child{flex:0 0 118px;color:var(--mute)}
.hc li.e{opacity:.4}
.msg{border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;background:rgba(3,8,18,.6)}
.msg summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:700}
.pill{font-size:.62rem;padding:2px 8px;border-radius:99px;background:#a78bfa;color:#06202e}
.pill.f{background:#22d3ee}
.st{margin-left:auto;font:700 .72rem ui-monospace,Menlo,monospace;padding:2px 8px;border-radius:6px}
.st.aa{background:#0f5a43;color:#7ef3c4}.st.ae{background:#5a1f2e;color:#ffb3c0}
.msg pre{margin:0;padding:0 12px 12px;font:.74rem/1.5 ui-monospace,Menlo,monospace;color:#7ef3c4;overflow-x:auto;white-space:pre}
.msg .nt{padding:0 12px 8px;font-size:.8rem;color:#ffb3c0}
.empty{color:var(--mute);padding:14px;text-align:center}
.fin{text-align:center}
.fin h2{font-size:1.2rem;color:#34d399;margin:4px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<span class="badge">Demo con datos ficticios</span>
<h1>Todo el proceso de un HIS, paso a paso</h1>
<p class="sub">Haz el trabajo de cada usuario, desde que llega el paciente hasta el cobro, y mira cómo se llena la historia clínica y qué mensajes viajan entre sistemas. Los mensajes están simplificados con fines educativos.</p>
<div class="steps" id="nav"></div>
<div id="main"></div>
<div class="tabs" id="tabs"></div>
<div id="panel"></div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var G="#34d399",A="#22d3ee",P="#a78bfa",Y="#fbbf24",B="#60a5fa";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var ST=[null,
{n:"Admisión",r:"Admisión y recepción",m:["Paciente","Admisión (ADT)","Agenda","Consentimientos"],c:G,h:"Registra al paciente que llega. Puedes cambiar el nombre ficticio y luego presiona Admitir.",why:"El módulo de admisión envió el mensaje ADT^A01 (ingreso). Desde ahora todos los sistemas saben que hay un paciente con una atención abierta."},
{n:"Triage",r:"Enfermería de ingreso",m:["Emergencias","Enfermería","Historia clínica"],c:A,h:"Toma los signos vitales, registra alergias y clasifica la urgencia. Prueba elegir Penicilina como alergia: más adelante verás para qué sirve.",why:"Los signos vitales viajaron como observaciones FHIR y la alergia quedó en la historia clínica, visible para el médico y la farmacia."},
{n:"Médico",r:"Médico",m:["Historia clínica","Órdenes clínicas","Alertas"],c:A,h:"Elige el diagnóstico y firma las indicaciones. Si hay alergia a penicilina, prueba recetar Amoxicilina.",why:"El diagnóstico (CIE-10), la orden de laboratorio (ORM) y la receta (RDE) viajaron solos a cada servicio. El motor de reglas revisó la receta contra la alergia."},
{n:"Laboratorio",r:"Laboratorio (tecnólogo médico)",m:["Laboratorio (LIS)","Órdenes clínicas"],c:P,h:"La orden de hemograma llegó sola. Ingresa o ajusta los valores y libera el resultado.",why:"El laboratorio liberó el resultado, pero el sistema central lo rechazó: el código local HB_LOCAL no existe en el catálogo común (LOINC). El médico todavía no lo ve."},
{n:"Farmacia",r:"Farmacia (químico farmacéutico)",m:["Farmacia","Inventario","Alertas"],c:P,h:"Revisa la receta que llegó y dispensa el medicamento.",why:"Farmacia validó, dispensó y descontó del inventario. Se envió el mensaje RDS^O13."},
{n:"Facturación",r:"Facturación y convenios",m:["Facturación","Seguros"],c:Y,h:"Revisa las prestaciones que se registraron y genera la cuenta del paciente.",why:"Facturación juntó las prestaciones registradas por los demás módulos y generó el cobro con el mensaje DFT^P03."},
{n:"TI",r:"TI · Analista de interoperabilidad",m:["Integraciones","Auditoría","Accesos y roles"],c:B,h:"El resultado de laboratorio fue rechazado. Revisa el error y relaciona el código local con el correcto.",why:"El analista relacionó el código local con LOINC y reenvió el mensaje. Ahora el resultado llegó a la historia clínica y el médico puede verlo."}];
var DX={"R10.4":"Otros dolores abdominales y los no especificados","R50.9":"Fiebre, no especificada","J06.9":"Infección aguda de las vías respiratorias superiores, no especificada"};
var TRI={C2:"Emergencia",C3:"Urgencia",C4:"Urgencia menor",C5:"No urgente"};
var COV={Fonasa:.6,Isapre:.7,Particular:0};
var S,mn=0;
function init(){S={step:1,view:1,tab:"hc",done:{},msgs:[],hc:{},fix:"",alert:"",p:{name:"Ana Pérez",motivo:"Dolor abdominal",prev:"Fonasa",cons:true,sis:120,dia:80,fc:88,tem:37.2,sat:98,alg:"Ninguna",tri:"C3",dx:"R10.4",hemo:true,med:"Paracetamol 500 mg",hb:13.5,wbc:14.2,map:""}};mn=0}
function ts(){var d=new Date(),p=function(n){return(n<10?"0":"")+n};return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
function nm(){var n=String(S.p.name).replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ ]/g,"").trim()||"Ana Pérez",a=n.split(/\s+/);return{full:n,pid:(a.length>1?a.slice(1).join(" "):a[0]).toUpperCase()+"^"+a[0].toUpperCase()}}
function hl7(t,from,to,segs){mn++;return "MSH|^~\\&|"+from+"|HOSP|"+to+"|HOSP|"+ts()+"||"+t+"|M"+(1000+mn)+"|P|2.5\n"+segs.join("\n")}
function pid(){return "PID|1||P0001||"+nm().pid}
function add(std,name,body,ok,note){S.msgs.push({std:std,name:name,body:body,ok:ok,note:note||""})}
function fl(v,lo,hi){return v<lo?"L":v>hi?"H":"N"}
function oru(code,txt,sys){var p=S.p,hb=+p.hb,wb=+p.wbc;return hl7("ORU^R01","LAB","HCE",[pid(),"OBR|1|O1001||58410-2^Hemograma^LN","OBX|1|NM|"+code+"^Hemoglobina^"+sys+"||"+hb+"|g/dL|12-16|"+fl(hb,12,16),"OBX|2|NM|6690-2^Leucocitos^LN||"+wb+"|10*3/uL|4.5-11|"+fl(wb,4.5,11)])}
function fld(l,h){return "<div><label>"+l+"</label>"+h+"</div>"}
function inp(k,t,x){return '<input type="'+t+'" data-k="'+k+'" value="'+esc(S.p[k])+'" '+(x||"")+'>'}
function sel(k,o){return '<select data-k="'+k+'">'+o.map(function(v){var val=Array.isArray(v)?v[0]:v,lb=Array.isArray(v)?v[1]:v;return '<option value="'+esc(val)+'"'+(S.p[k]==val?" selected":"")+">"+esc(lb)+"</option>"}).join("")+"</select>"}
function why(i){return S.done[i]?'<div class="box ok"><b class="t">Por detrás</b>'+ST[i].why+"</div>":""}
function nxt(i){return S.done[i]&&i<7?'<br><button class="btn g" data-go="'+(i+1)+'">Siguiente rol: '+ST[i+1].r+" →</button>":""}
function screen(i){var p=S.p,d=S.done[i],dis=d?" disabled":"",h="";
 if(i==1){h='<div class="g2">'+fld("Paciente (nombre ficticio)",inp("name","text",'maxlength="40"'+dis))+fld("Motivo de consulta",sel("motivo",["Dolor abdominal","Fiebre","Control"]))+fld("Previsión",sel("prev",["Fonasa","Isapre","Particular"]))+"</div>"+'<label class="ck"><input type="checkbox" data-k="cons"'+(p.cons?" checked":"")+dis+"> Consentimiento informado firmado</label>"+(d?'<div class="box ok"><b class="t">Admitido</b>'+esc(nm().full)+" · P0001 · Episodio E1001</div>":'<button class="btn" data-a="1">Admitir paciente</button>')}
 if(i==2){h='<div class="g2">'+fld("PA sistólica",inp("sis","number",dis))+fld("PA diastólica",inp("dia","number",dis))+fld("Frecuencia cardíaca",inp("fc","number",dis))+fld("Temperatura °C",inp("tem","number",'step="0.1"'+dis))+fld("Saturación O₂ %",inp("sat","number",dis))+fld("Alergia",sel("alg",["Ninguna","Penicilina"]))+fld("Triage",sel("tri",[["C2","C2 Emergencia"],["C3","C3 Urgencia"],["C4","C4 Urgencia menor"],["C5","C5 No urgente"]]))+"</div>"+(d?"":'<button class="btn" data-a="2">Guardar triage</button>')}
 if(i==3){h='<p style="margin:0 0 8px;color:var(--mute)">Alergia registrada: <b style="color:#fff">'+esc(p.alg)+"</b></p>"+'<div class="g2">'+fld("Diagnóstico (CIE-10)",sel("dx",Object.keys(DX).map(function(k){return[k,k+" · "+DX[k].split(",")[0]]})))+fld("Medicamento",sel("med",["Paracetamol 500 mg","Amoxicilina 500 mg"]))+"</div>"+'<label class="ck"><input type="checkbox" data-k="hemo"'+(p.hemo?" checked":"")+dis+"> Solicitar hemograma</label>"+(S.alert?'<div class="box bad"><b class="t">Motor de reglas: prescripción bloqueada</b>'+S.alert+"</div>":"")+(d?"":'<button class="btn" data-a="3">Firmar indicaciones</button>')}
 if(i==4){h=S.done[3]&&p.hemo?'<div class="card" style="margin:0 0 8px;background:rgba(255,255,255,.04)"><b>Orden O1001 · Hemograma</b><br><span class="rg">Paciente: '+esc(nm().full)+" · Triage "+p.tri+'</span></div><div class="g2">'+fld("Hemoglobina g/dL <span class='rg'>(12–16)</span>",inp("hb","number",'step="0.1"'+dis))+fld("Leucocitos 10³/µL <span class='rg'>(4,5–11)</span>",inp("wbc","number",'step="0.1"'+dis))+"</div>"+(d?"":'<button class="btn" data-a="4">Validar y liberar resultado</button>')+(d?'<div class="box warn"><b class="t">Mensaje rechazado</b>El sistema central devolvió un error (AE). Revisa la pestaña Mensajes.</div>':""):'<div class="box warn">No hay órdenes de laboratorio. El médico no solicitó hemograma: puedes volver al rol médico o seguir al siguiente.</div>'+(d?"":'<button class="btn g" data-a="4s">Continuar sin orden</button>')}
 if(i==5){h='<div class="card" style="margin:0 0 8px;background:rgba(255,255,255,.04)"><b>Receta R1001 · '+esc(p.med)+'</b><br><span class="rg">Dosis ✓ · Interacciones ✓ · Alergias ✓ ('+esc(p.alg)+')</span></div><p style="margin:0;color:var(--mute)">Stock: '+(d?"119":"120")+" unidades"+(d?" (descontado 1)":"")+"</p>"+(d?"":'<button class="btn" data-a="5">Dispensar</button>')}
 if(i==6){var it=[["Consulta médica",25000]];if(p.hemo)it.push(["Hemograma",8000]);it.push([p.med,p.med.indexOf("Amox")==0?6000:3500]);var t=it.reduce(function(a,x){return a+x[1]},0),c=Math.round(t*COV[p.prev]);h='<table class="tb">'+it.map(function(x){return"<tr><td>"+esc(x[0])+"</td><td>$"+x[1].toLocaleString("es-CL")+"</td></tr>"}).join("")+'<tr class="t"><td>Total</td><td>$'+t.toLocaleString("es-CL")+"</td></tr><tr><td>Cobertura "+p.prev+" ("+Math.round(COV[p.prev]*100)+"%)</td><td>−$"+c.toLocaleString("es-CL")+'</td></tr><tr class="t"><td>Paga el paciente</td><td>$'+(t-c).toLocaleString("es-CL")+'</td></tr></table><p class="rg">Valores y coberturas ficticios.</p>'+(d?"":'<button class="btn" data-a="6">Generar cuenta</button>')}
 if(i==7){var bad=S.msgs.filter(function(m){return!m.ok}).length;
  if(!S.done[4]){h='<div class="box warn">Aún no hay mensajes con error. Completa el paso del laboratorio.</div>'}
  else if(!d&&bad==0){h='<div class="box ok"><b class="t">Sin errores</b>Esta vez no hubo mensajes rechazados. Revisa la pestaña Mensajes y finaliza.</div><button class="btn" data-a="7f">Finalizar</button>'}
  else if(!d){h='<div class="box bad"><b class="t">Error en integración · ORU^R01 · AE</b>OBX-3: código HB_LOCAL sin mapeo en el catálogo común.</div><div style="margin-top:10px">'+fld("Relacionar HB_LOCAL (Hemoglobina) con…",sel("map",[["","Elige un código"],["718-7","718-7 · Hemoglobina (LOINC)"],["6690-2","6690-2 · Leucocitos (LOINC)"],["2345-7","2345-7 · Glucosa (LOINC)"]]))+"</div>"+(S.fix?'<div class="box bad">'+S.fix+"</div>":"")+'<button class="btn" data-a="7">Aplicar mapeo y reenviar</button>'}
  else{h='<div class="fin"><h2>¡Recorrido completo!</h2><p>'+S.msgs.length+" mensajes enviados entre sistemas"+(S.msgs.some(function(m){return!m.ok})?", 1 rechazado y corregido":"")+", 7 usuarios participando.</p><p class='rg'>Así trabaja la interoperabilidad: cuando un código no coincide, el dato no llega, y alguien tiene que detectarlo y corregirlo.</p><button class='btn' data-a='r'>Reiniciar demo</button></div>"}}
 return h}
function act(a){var p=S.p,n=nm();S.alert="";
 if(a=="r"){init();draw();scrollTo(0,0);return}
 if(a=="1"){if(!p.cons)return alert("Falta el consentimiento informado.");add("HL7 v2","ADT^A01",hl7("ADT^A01","ADMISION","HCE",[pid(),"PV1|1|E|URG^^^HOSP||||||||||||||||E1001"]),1);S.hc.ing=n.full+" · P0001 · "+p.prev+" · "+p.motivo;fin(1)}
 if(a=="2"){var ob=[{code:"85354-9",display:"Presión arterial",value:p.sis+"/"+p.dia,unit:"mmHg"},{code:"8867-4",display:"Frecuencia cardíaca",value:+p.fc,unit:"/min"},{code:"8310-5",display:"Temperatura",value:+p.tem,unit:"°C"},{code:"59408-5",display:"Saturación O2",value:+p.sat,unit:"%"}];add("FHIR","Observation ×4",JSON.stringify(ob,null,1),1);
  if(p.alg!="Ninguna")add("FHIR","AllergyIntolerance",JSON.stringify({resourceType:"AllergyIntolerance",patient:"Patient/P0001",code:{text:p.alg},clinicalStatus:"active"},null,1),1);
  S.hc.vit="PA "+p.sis+"/"+p.dia+" · FC "+p.fc+" · T° "+p.tem+" · SatO₂ "+p.sat+"%";S.hc.alg=p.alg;S.hc.tri=p.tri+" "+TRI[p.tri];fin(2)}
 if(a=="3"){if(p.alg=="Penicilina"&&p.med.indexOf("Amox")==0){S.alert="La paciente tiene alergia registrada a penicilina y la amoxicilina pertenece a esa familia. Cambia el medicamento.";draw();return}
  add("FHIR","Condition (CIE-10)",JSON.stringify({resourceType:"Condition",subject:"Patient/P0001",code:{coding:[{system:"icd-10",code:p.dx,display:DX[p.dx]}]}},null,1),1);
  if(p.hemo)add("HL7 v2","ORM^O01",hl7("ORM^O01","HCE","LAB",[pid(),"ORC|NW|O1001","OBR|1|O1001||58410-2^Hemograma^LN"]),1);
  add("HL7 v2","RDE^O11",hl7("RDE^O11","HCE","FARM",[pid(),"ORC|NW|R1001","RXE||"+p.med.toUpperCase().replace(/ /g,"_")+"|1|COMP|VO"]),1);
  S.hc.dx=p.dx+" · "+DX[p.dx];S.hc.ord=(p.hemo?"Hemograma · ":"")+p.med;S.hc.res=p.hemo?"Pendiente":"Sin orden";fin(3)}
 if(a=="4s"){S.hc.res="Sin orden";fin(4)}
 if(a=="7f"){fin(7)}
 if(a=="4"){add("HL7 v2","ORU^R01",oru("HB_LOCAL","Hemoglobina","L"),0,"ACK AE · OBX-3: código HB_LOCAL sin mapeo en el catálogo común");S.hc.res="Pendiente (mensaje rechazado)";fin(4)}
 if(a=="5"){add("HL7 v2","RDS^O13",hl7("RDS^O13","FARM","HCE",[pid(),"ORC|RE|R1001","RXD|1|"+p.med.toUpperCase().replace(/ /g,"_")+"|"+ts()+"|1|COMP"]),1);S.hc.disp=p.med+" dispensado";fin(5)}
